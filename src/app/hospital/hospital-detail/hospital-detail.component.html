  <div class="pageTitle" >
      {{pageTitle}}
  </div>
<form (ngSubmit)="onSubmit()" #doctorForm="ngForm" class="formClass">
   <div class="buttonBar" style="margin-top:10px">
      @if(action == 'detail')
      {
          <button class="btn btn-light headerButton" type="button" (click)="navigateBack()">Go Back</button>
          <button class="btn btn-light headerButton" type="button" (click)="updateClick()">Update</button>
      }
      @else {
          <button class="btn btn-success headerButton"  type="submit">Save</button>
          <button class="btn btn-warning"  type="button" (click)="navigateBack()">Cancel</button>
      }
   </div>

    <div class="container">
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="name"  [disabled]=disableControls  [(ngModel)]="hospital.name"  />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">Address *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="address"  [disabled]=disableControls  [(ngModel)]="hospital.address"  />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">PhoneNumber *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="phoneNumber"  [disabled]=disableControls  [(ngModel)]="hospital.phoneNumber"  />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">Email *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="email"  [disabled]=disableControls  [(ngModel)]="hospital.email"  />
        </div>   
      </div>
    </div>
    </form>
