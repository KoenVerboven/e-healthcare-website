<p class="pageTitle">{{PageTitle}}</p>
<div class="buttonBar">
    <button   style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="addHospital()"><i class="bi bi-plus"></i> Add New Hospital</button>
</div>
<table class="table table-sm  table-hover table-striped" style="overflow:hidden; border-radius:5px;">
    <thead>
      <tr class="cell-hoverCursor">
         <th class="p-2" style="width: 12%;text-align:left;">Name</th>
         <th class="p-2" style="width: 20%;text-align:left;">Address</th>
         <th class="p-2" style="width: 20%;text-align:left;">Phone Number</th>
         <th class="p-2" style="width: 10%;text-align:left;">Email</th>
      </tr>
    </thead>
    <tbody>
      @for(hospital of hospitals; track  hospital.id) {
        <tr  (click)="showHospitalDetail(hospital.id)" class="cell-hoverCursor" >
          <td class="p-2" style="text-align: left;">{{hospital.name}}</td>
          <td class="p-2" style="text-align: left;">{{hospital.address}}</td>
          <td class="p-2" style="text-align: left;">{{hospital.phoneNumber}}</td>
          <td class="p-2" style="text-align: left;">{{hospital.email}}</td>
        </tr>
      }
  </table>
@if(error != "")
{
  <br/><br/><br/>  
  <div class="errorLabel">{{error}}</div>
}
@if(loading)
{
  <div style="margin-left: 200px;">
    <div fxLayout="row" fxLayoutAlign="space-around center" style="height:100%;">
       <mat-spinner diameter="70" strokeWidth="5"></mat-spinner>
    </div>
    <div>loading</div> 
  </div>
}
