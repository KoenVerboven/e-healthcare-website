<p> Choose a time </p>
<div class="container">
  <div class="row">
      @for(colomnNr of columnNrs; track colomnNr){
        <div class="col-sm">
          @for(appointmentTimeItem of items; track appointmentTimeItem.id ){
            @if(appointmentTimeItem.columnNr == colomnNr)
            {
              <app-appointment-time-item [appointmentTimeItem]="appointmentTimeItem" />
            }
          }
        </div>
      }
  </div>
</div>
