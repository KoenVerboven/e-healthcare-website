<div class="pageTitle" >
  {{pageTitle}}
</div>
<div class="buttonBar" style="margin-top:10px">
   @if(this.action == 'detail')
   {
      <button class="btn btn-light headerButton" type="button" (click)="navigateBack()"><i class="bi bi-arrow-return-left"></i> Go Back</button>
      <button class="btn btn-light headerButton" type="button" (click)="updateClick()">Update</button>
  }
   @else {
      <button class="btn btn-light headerButton"  type="submit"><i class="bi bi-floppy"></i> Save</button>
      <button class="btn btn-light headerButton" type="button" (click)="navigateBack()"><i class="bi bi-x-lg"></i> Cancel</button>
  }
</div>
<button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button">Choose Patient</button>
<button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button">Choose Doctor</button>
<button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button">Choose Place</button>
<br/><br/>
<p>Patient : {{ selectedPatient }}</p>
<p>Doctor : {{ selectedDoctor }}</p>
<p>Place : {{ selectedPlace }}</p>
<p><textarea placeholder="Enter appointment notes..." style="width: 350px; height: 100px;"></textarea></p>

<div class="container text-left" style="margin-top: 20px;">
  <div class="row">
    <div class="col">
      <p>Selected Date : {{ selectedDate }}</p>
      <mat-card class="calendar-card">
         <mat-calendar [(selected)]="selectedDate"></mat-calendar>
      </mat-card>
    </div>
    <div class="col">
      <app-appointment-time-list />
    </div>
    <div class="col">
      
    </div>
  </div>
  <div class="row">
    <div class="col">
      
    </div>
    <div class="col">
      
    </div>
    <div class="col">
      
    </div>
  </div>
</div>
