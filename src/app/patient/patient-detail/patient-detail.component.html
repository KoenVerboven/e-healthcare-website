 @if(errorMessage != '')
 {
   <div  class="text-danger text-center">
      {{errorMessage}}
   </div>
 }
 
 <div class="pageTitle" >
      {{pageTitle}}
  </div>
<form (ngSubmit)="onSubmit()" #doctorForm="ngForm" class="formClass">
   <div class="buttonBar" style="margin-top:10px">
      @if(this.action == 'detail')
      {
          <button class="btn btn-light headerButton" type="button" (click)="navigateBack()">Go Back</button>
          <button class="btn btn-light headerButton" type="button" (click)="updateClick()">Update</button>
      }
      @else {
          <button class="btn btn-success headerButton"  type="submit">Save</button>
          <button class="btn btn-warning"  type="button" (click)="navigateBack()">Cancel</button>
      }
   </div>

    <div class="container">
      <div class="row detailDataRow" >
        <div class="col-2">
          <label class="form-label" style="float:right">Last Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="lastName" [disabled]=disableControls [(ngModel)]="patient.lastName" />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">First Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="firstName" [disabled]=disableControls [(ngModel)]="patient.firstName" />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">Address *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="address" [disabled]=disableControls [(ngModel)]="patient.address" />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">PhoneNumber *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="phoneNumber" [disabled]=disableControls [(ngModel)]="patient.phoneNumber" />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">Email *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="email" [disabled]=disableControls [(ngModel)]="patient.email" />
        </div>   
      </div>
   </div>
</form>
