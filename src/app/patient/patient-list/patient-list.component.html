<p class="pageTitle">Patients</p>
<div class="buttonBar">
    <button style="float:left; margin-left: 15px;" class="btn btn-light" type="button"><i class="bi bi-plus"></i> Add New Patient</button>
</div>
<table class="table table-sm  table-hover table-striped" style="overflow:hidden; border-radius:5px;">
    <thead>
      <tr class="cell-hoverCursor">
         <th class="p-2" style="width: 12%;text-align:left;">LastName</th>
         <th class="p-2" style="width: 20%;text-align:left;">FirstName</th>
         <th class="p-2" style="width: 12%;text-align:left;">Birth Date</th>
         <th class="p-2" style="width: 20%;text-align:left;">Gender</th>
         <th class="p-2" style="width: 20%;text-align:left;">Mobile</th>
      </tr>
    </thead>
    <tbody>
      @for(patient of patients; track patient.id) {
        <tr (click)="showPatientDetail(patient.id)" class="cell-hoverCursor">      
          <td style="text-align: left;">{{patient.lastName}}</td>       
          <td style="text-align: left;">{{patient.firstName}}</td>   
          <td style="text-align: left;">{{patient.dateOfBirth | date}}</td>   
          <td style="text-align: left;">{{patient.gender}}</td>
          <td style="text-align: left;">{{patient.phoneNumber}}</td>
        </tr>  
      }
    </tbody>
  </table>
