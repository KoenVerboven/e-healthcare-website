<p class="pageTitle">Patients</p>
<div class="buttonBar">
    <button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="addPatient()"><i class="bi bi-plus"></i> Add New Patient</button>
    <button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="showAppointments()"><i class="bi bi-calendar-check"></i>  Appointments</button>
    <button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="showMedicalRecord()"><i class="bi bi-clipboard-pulse"></i> Medical Record</button>
    <button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="showInvoices()"><i class="bi bi-currency-exchange"></i> Invoices</button>
  </div>
  <div  class="buttonBar">
    <input type="text"  placeholder="Lastname"  [(ngModel)]="patientSpecParams.lastName"  style="float:left;width: 300px;margin-left:20px;margin-right: 10px;">
    <input type="text"  placeholder="Firstname"  [(ngModel)]="patientSpecParams.firstName"  style="float:left;width: 300px;margin-left:20px;margin-right: 10px;">
    <button  style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="getStudentsByFilter()" ><i class="bi bi-search"></i> Search</button>
    <button  style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" ><i class="bi bi-x-lg"></i> Clear Search</button>
  </div>

<table class="table table-sm  table-hover table-striped" style="overflow:hidden; border-radius:5px;">
    <thead>
      <tr class="cell-hoverCursor">
         <th class="p-2" style="width: 12%;text-align:left;">LastName</th>
         <th class="p-2" style="width: 20%;text-align:left;">FirstName</th>
         <th class="p-2" style="width: 12%;text-align:left;">Birth Date</th>
         <th class="p-2" style="width: 20%;text-align:left;">Gender</th>
         <th class="p-2" style="width: 20%;text-align:left;">Mobile</th>
      </tr>
    </thead>
    <tbody>
      @for(patient of patients; track patient.id) {
        <tr (click)="showPatientDetail(patient.id)" class="cell-hoverCursor">      
          <td style="text-align: left;">{{patient.lastName}}</td>       
          <td style="text-align: left;">{{patient.firstName}}</td>   
          <td style="text-align: left;">{{patient.dateOfBirth | date}}</td>   
          <td style="text-align: left;">{{patient.gender}}</td>
          <td style="text-align: left;">{{patient.phoneNumber}}</td>
        </tr>  
      }
    </tbody>
  </table>
@if(error != "")
{
  <br/><br/><br/>  
  <div class="errorLabel">{{error}}</div>
}
@if(loading)
{
  <div style="margin-left: 200px;">
    <div fxLayout="row" fxLayoutAlign="space-around center" style="height:100%;">
       <mat-spinner diameter="70" strokeWidth="5"></mat-spinner>
    </div>
    <div>loading</div> 
  </div>
}
