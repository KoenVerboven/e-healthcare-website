<p class="pageTitle">Doctors</p>
<table class="table table-sm  table-hover table-striped" style="overflow:hidden; border-radius:5px;">
    <thead>
      <tr class="cell-hoverCursor">
         <th class="p-2" style="width: 12%;text-align:left;">LastName</th>
         <th class="p-2" style="width: 20%;text-align:left;">FirstName</th>
         <th class="p-2" style="width: 20%;text-align:left;">Mobile</th>
         <th class="p-2" style="width: 20%;text-align:left;">Email</th>
      </tr>
    </thead>
    <tbody>
        @for(doctor of doctors; track doctor.id) {
        <tr (click)="showDoctorDetail(doctor.id)" class="cell-hoverCursor" >
          <td class="p-2" style="text-align: left;">{{doctor.lastName}}</td>
          <td class="p-2" style="text-align: left;">{{doctor.firstName}}</td>
          <td class="p-2" style="text-align: left;">{{doctor.phoneNumber}}</td>
          <td class="p-2" style="text-align: left;">{{doctor.email}}</td>
        </tr>
      }
    </tbody>
  </table>
