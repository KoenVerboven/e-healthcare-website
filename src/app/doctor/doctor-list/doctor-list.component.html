<p class="pageTitle">Doctors</p>
<div class="buttonBar">
    <button style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="addDoctor()"><i class="bi bi-plus"></i> Add New Doctor</button>
</div>
<div  class="buttonBar">
    <input type="text"  placeholder="Lastname"  [(ngModel)]="doctorSpecParams.lastName"  style="float:left;width: 300px;margin-left:20px;margin-right: 10px;">
    <input type="text"  placeholder="Firstname"  [(ngModel)]="doctorSpecParams.firstName"  style="float:left;width: 300px;margin-left:20px;margin-right: 10px;">
    <button  style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="getDoctorsByFilter()" ><i class="bi bi-search"></i> Search</button>
    <button  style="float:left; margin-left: 15px;" class="btn btn-light headerButton" type="button" (click)="clearSearch()"><i class="bi bi-x-lg"></i> Clear Search</button>
    <label style="float: right;">{{doctorsCount}} patients found</label>
  </div>
<table class="table table-sm  table-hover table-striped" style="overflow:hidden; border-radius:5px;">
    <thead>
      <tr class="cell-hoverCursor">
         <th class="p-2" style="width: 12%;text-align:left;">LastName</th>
         <th class="p-2" style="width: 20%;text-align:left;">FirstName</th>
         <th class="p-2" style="width: 20%;text-align:left;">Mobile</th>
         <th class="p-2" style="width: 20%;text-align:left;">Email</th>
      </tr>
    </thead>
    <tbody>
        @for(doctor of doctors; track doctor.id) {
        <tr (click)="showDoctorDetail(doctor.id)" class="cell-hoverCursor" >
          <td class="p-2" style="text-align: left;">{{doctor.lastName}}</td>
          <td class="p-2" style="text-align: left;">{{doctor.firstName}}</td>
          <td class="p-2" style="text-align: left;">{{doctor.phoneNumber}}</td>
          <td class="p-2" style="text-align: left;">{{doctor.email}}</td>
        </tr>
      }
    </tbody>
  </table>
@if(error != "")
{
  <br/><br/><br/>  
  <div class="errorLabel">{{error}}</div>
}
@if(loading)
{
  <div style="margin-left: 200px;">
    <div fxLayout="row" fxLayoutAlign="space-around center" style="height:100%;">
       <mat-spinner diameter="70" strokeWidth="5"></mat-spinner>
    </div>
    <div>loading</div> 
  </div>
}
