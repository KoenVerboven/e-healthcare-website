  @if(errorMessage != '')
{
   <div  class="text-danger text-center">
      {{errorMessage}}
   </div>
}
  <div class="pageTitle" >
      {{pageTitle}}
  </div>
  <form (ngSubmit)="onSubmit()" #doctorForm="ngForm" class="formClass">
   <div class="buttonBar" style="margin-top:10px">
      @if(action == 'detail')
      {
          <button class="btn btn-light headerButton" type="button" (click)="navigateBack()"><i class="bi bi-arrow-return-left"></i> Go Back</button>
          <button class="btn btn-light headerButton" type="button" (click)="updateClick()">Update</button>
          <button type="button" class="btn btn-light "  style="color:red" data-bs-toggle="modal" data-bs-target="#exampleModal"><i class="bi bi-trash"></i> Delete</button>
      }
      @else {
          <button class="btn btn-light headerButton"  type="submit"><i class="bi bi-floppy"></i> Save</button>
          <button class="btn btn-light headerButton"  type="button" (click)="navigateBack()"><i class="bi bi-x-lg"></i> Cancel</button>
      }
   </div>

    <div class="container">
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">Last Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="lastName" [disabled]=disableControls  [(ngModel)]="doctor.lastName"  />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">First Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="firstName" [disabled]=disableControls [(ngModel)]="doctor.firstName"  />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">Address *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="address" [disabled]=disableControls [(ngModel)]="doctor.address" />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">PhoneNumber *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="phoneNumber" [disabled]=disableControls [(ngModel)]="doctor.phoneNumber" />
        </div>   
      </div>
      <div class="row detailDataRow">
        <div class="col-2">
          <label class="form-label" style="float:right">Email *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="email"  [disabled]=disableControls [(ngModel)]="doctor.email" />
        </div>   
      </div>
    </div>
  </form>
