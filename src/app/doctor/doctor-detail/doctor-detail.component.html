  <div class="pageTitle" >
      {{pageTitle}}
  </div>

   <div class="buttonBar" style="margin-top:10px">
      @if(formAction == 'detail')
      {
          <button class="btn btn-light headerButton" type="button" (click)="navigateBack()">Go Back</button>
          <button class="btn btn-light headerButton" type="button" (click)="updateClick()">Update</button>
      }
      @else {
          <button class="btn btn-success headerButton"  type="submit">Save</button>
          <button class="btn btn-warning"  type="button" (click)="navigateBack()">Cancel</button>
      }
   </div>

    <div class="container">
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">Last Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="lastName"   />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">First Name *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="firstName"  />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">Address *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="address"  />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">PhoneNumber *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="phoneNumber"  />
        </div>   
      </div>
      <div class="row">
        <div class="col-2">
          <label class="form-label" style="float:right">Email *</label>    
        </div>
        <div class="col-10">
          <input required maxlength="30"  class="form-control"  type="text" name="email"  />
        </div>   
      </div>
      
   </div>
